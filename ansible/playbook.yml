# STEP 3b: Configures the Amazon Linux EC2 box Terraform created.
# Installs Java, Jenkins, Docker, Maven, Nexus, Grafana, kubectl,
# Helm, and AWS CLI.
#
# Run with:
# ansible-playbook -i inventory.ini playbook.yml

- name: Configure CI/CD server
  hosts: cicd_server
  become: true

  collections:
    - community.docker

  tasks:

    # ---------------------------------------------------------
    # SYSTEM UPDATE
    # ---------------------------------------------------------

    - name: Update DNF packages
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    # ---------------------------------------------------------
    # BASIC PACKAGES
    # ---------------------------------------------------------

    - name: Install required packages
      ansible.builtin.dnf:
        name:
          - wget
          - unzip
          - git
          - tar
          - gzip
          - fontconfig
          - java-21-amazon-corretto
          - maven
          - docker
        state: present

    - name: Install AWS CLI v2 via official installer
      ansible.builtin.shell: |
        curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "/tmp/awscliv2.zip"
        unzip -q /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install --update
        rm -rf /tmp/awscliv2.zip /tmp/aws
      args:
        creates: /usr/local/bin/aws

    # ---------------------------------------------------------
    # JENKINS
    # ---------------------------------------------------------

    - name: Download Jenkins RPM repository
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/rpm-stable/jenkins.repo
        dest: /etc/yum.repos.d/jenkins.repo
        mode: "0644"

    - name: Import Jenkins repository signing key
      ansible.builtin.rpm_key:
        state: present
        key: https://pkg.jenkins.io/rpm-stable/jenkins.io-2026.key

    - name: Install Jenkins
      ansible.builtin.dnf:
        name: jenkins
        state: present

    - name: Start and enable Jenkins
      ansible.builtin.systemd:
        name: jenkins
        state: started
        enabled: true

    # ---------------------------------------------------------
    # DOCKER
    # ---------------------------------------------------------

    - name: Start and enable Docker
      ansible.builtin.systemd:
        name: docker
        state: started
        enabled: true

    - name: Add Jenkins user to Docker group
      ansible.builtin.user:
        name: jenkins
        groups: docker
        append: true

    - name: Add ec2-user to Docker group
      ansible.builtin.user:
        name: ec2-user
        groups: docker
        append: true

    # ---------------------------------------------------------
    # NEXUS
    # ---------------------------------------------------------

    - name: Create Nexus data directory
      ansible.builtin.file:
        path: /opt/nexus/data
        state: directory
        owner: "200"
        group: "200"
        mode: "0755"

    - name: Run Nexus in Docker
      community.docker.docker_container:
        name: nexus
        image: sonatype/nexus3:latest
        state: started
        restart_policy: always
        ports:
          - "8081:8081"
          - "8082:8082"
        volumes:
          - /opt/nexus/data:/nexus-data

    # ---------------------------------------------------------
    # GRAFANA
    # ---------------------------------------------------------

    - name: Run Grafana in Docker
      community.docker.docker_container:
        name: grafana
        image: grafana/grafana:latest
        state: started
        restart_policy: always
        ports:
          - "3000:3000"

    # ---------------------------------------------------------
    # KUBECTL
    # ---------------------------------------------------------

    - name: Download kubectl
      ansible.builtin.get_url:
        url: https://dl.k8s.io/release/v1.29.0/bin/linux/amd64/kubectl
        dest: /usr/local/bin/kubectl
        mode: "0755"

    # ---------------------------------------------------------
    # HELM
    # ---------------------------------------------------------

    - name: Download Helm binary
      ansible.builtin.get_url:
        url: https://get.helm.sh/helm-v3.17.0-linux-amd64.tar.gz
        dest: /tmp/helm.tar.gz
        mode: "0644"

    - name: Extract and install Helm
      ansible.builtin.shell: |
        tar -xzf /tmp/helm.tar.gz -C /tmp
        mv /tmp/linux-amd64/helm /usr/local/bin/helm
        rm -rf /tmp/helm.tar.gz /tmp/linux-amd64
      args:
        creates: /usr/local/bin/helm

    # ---------------------------------------------------------
    # FINAL CHECKS
    # ---------------------------------------------------------

    - name: Check Docker installation
      ansible.builtin.command:
        cmd: docker --version
      register: docker_version
      changed_when: false

    - name: Check Java installation
      ansible.builtin.command:
        cmd: java -version
      register: java_version
      changed_when: false

    - name: Check Maven installation
      ansible.builtin.command:
        cmd: mvn --version
      register: maven_version
      changed_when: false

    - name: Display Docker version
      ansible.builtin.debug:
        var: docker_version.stdout

    - name: Display Maven version
      ansible.builtin.debug:
        var: maven_version.stdout